name: Setup OCaml
description: Restore or install the repository OPAM environment.

inputs:
  compiler:
    description: OCaml compiler switch specification.
    required: true
  os:
    description: Runner identifier used in the cache key.
    required: true
  cache-prefix:
    description: Cache namespace and version.
    required: true
  dependency-flags:
    description: Flags passed to opam install after the package path.
    required: false
    default: --deps-only --with-test
outputs:
  setup_version:
    description: Version of ocaml/setup-ocaml used by this action.
    value: ${{ steps.cache-key.outputs.setup-version }}

runs:
  using: composite
  steps:
    # wasm_of_ocaml requires Binaryen 119 or newer, including wasm-merge.
    # Hosted runners do not consistently provide a suitable complete version,
    # so use the same pinned official release on Linux and macOS.
    - name: Install Binaryen
      if: runner.os != 'Windows'
      shell: bash
      env:
        BINARYEN_VERSION: "133"
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            platform=x86_64-linux
            checksum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
            ;;
          Linux-ARM64)
            platform=aarch64-linux
            checksum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8
            ;;
          macOS-ARM64)
            platform=arm64-macos
            checksum=ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8
            ;;
          *)
            echo "Unsupported Binaryen platform: $RUNNER_OS-$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        archive="binaryen-version_${BINARYEN_VERSION}-${platform}.tar.gz"
        install_dir="$RUNNER_TOOL_CACHE/binaryen/$BINARYEN_VERSION/$RUNNER_ARCH"
        curl -fsSL \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${archive}" \
          -o "$RUNNER_TEMP/$archive"

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "$checksum  $RUNNER_TEMP/$archive" | shasum -a 256 --check
        else
          echo "$checksum  $RUNNER_TEMP/$archive" | sha256sum --check
        fi

        mkdir -p "$install_dir"
        tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$install_dir"
        echo "$install_dir/bin" >> "$GITHUB_PATH"

    - name: Get OPAM cache key
      id: cache-key
      shell: bash
      env:
        CACHE_PREFIX: ${{ inputs.cache-prefix }}
        COMPILER: ${{ inputs.compiler }}
        DEPENDENCY_FLAGS: ${{ inputs.dependency-flags }}
        OS: ${{ inputs.os }}
      run: |
        dependency_flags_key="${DEPENDENCY_FLAGS//--/}"
        dependency_flags_key="${dependency_flags_key// /_}"
        dependency_hash="${{ hashFiles('*.opam') }}"
        key="$CACHE_PREFIX-$OS-3.9.0-$COMPILER-$dependency_flags_key-$dependency_hash"
        echo "value=${key//,/-}" >> "$GITHUB_OUTPUT"
        echo "setup-version=3.9.0" >> "$GITHUB_OUTPUT"

    - name: Restore OPAM environment
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          _opam
          .opam-path
          C:\cygwin
          C:\.opam
        key: ${{ steps.cache-key.outputs.value }}

    - name: Use OCaml ${{ inputs.compiler }}
      if: steps.cache.outputs.cache-hit != 'true'
      uses: ocaml/setup-ocaml@v3.9.0
      with:
        ocaml-compiler: ${{ inputs.compiler }}
        # Use the HTTP repository to prevent intermittent CI setup failures:
        # the Git-backed default can race with detached Git maintenance while
        # OPAM scans it (https://github.com/ocaml/opam/issues/7031).
        opam-repositories: |
          default: https://opam.ocaml.org
        opam-pin: false
        cache: false

    - name: Get OPAM executable path
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const opamPath = await io.which('opam', true);
          console.log('opam executable found: %s', opamPath);

          const fs = require('fs/promises');
          await fs.writeFile('.opam-path', opamPath, 'utf-8');
          console.log('stored path to .opam-path');

    - name: Install OPAM dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEPENDENCY_FLAGS: ${{ inputs.dependency-flags }}
      run: |
        read -ra dependency_flags <<< "$DEPENDENCY_FLAGS"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          export AR=x86_64-w64-mingw32-ar
          export RANLIB=x86_64-w64-mingw32-ranlib
          export STRIP=x86_64-w64-mingw32-strip
          export NM=x86_64-w64-mingw32-nm
          export DLLTOOL=x86_64-w64-mingw32-dlltool
          export OBJDUMP=x86_64-w64-mingw32-objdump
        fi
        opam install . "${dependency_flags[@]}"

    - name: Cache OPAM environment
      # Caches created by pull_request runs are scoped to that PR's merge ref
      # and cannot seed other PRs or branches, so only push runs save them.
      if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          _opam
          .opam-path
          C:\cygwin
          C:\.opam
        key: ${{ steps.cache-key.outputs.value }}

    - name: Use cached OPAM environment
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "OPAMCOLOR=always"                    >> "$GITHUB_ENV"
        echo "OPAMCONFIRMLEVEL=unsafe-yes"         >> "$GITHUB_ENV"
        echo "OPAMDOWNLOADJOBS=4"                  >> "$GITHUB_ENV"
        echo "OPAMERRLOGLEN=0"                     >> "$GITHUB_ENV"
        echo "OPAMEXTERNALSOLVER=builtin-0install" >> "$GITHUB_ENV"
        echo "OPAMPRECISETRACKING=1"               >> "$GITHUB_ENV"
        echo "OPAMRETRIES=10"                      >> "$GITHUB_ENV"
        echo "OPAMSOLVERTIMEOUT=600"               >> "$GITHUB_ENV"
        echo "OPAMYES=1"                           >> "$GITHUB_ENV"
        echo "CLICOLOR_FORCE=1"                    >> "$GITHUB_ENV"

        if [[ "$RUNNER_OS" != "Windows" ]]; then
          echo "OPAMROOT=$HOME/.opam" >> "$GITHUB_ENV"
        else
          echo "OPAMROOT=C:\\.opam" >> "$GITHUB_ENV"
        fi

        OPAM_PATH="$(cat .opam-path)"
        chmod +x "$OPAM_PATH"
        dirname "$OPAM_PATH" >> "$GITHUB_PATH"

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          fsutil behavior query SymlinkEvaluation
          fsutil behavior set symlinkEvaluation R2L:1 R2R:1
          fsutil behavior query SymlinkEvaluation

          echo "HOME=$USERPROFILE" >> "$GITHUB_ENV"
          echo "MSYS=winsymlinks:native" >> "$GITHUB_ENV"
          echo "CYGWIN=winsymlinks:native" >> "$GITHUB_ENV"
          echo "BASH_ENV=C:\\cygwin\\bash_env" >> "$GITHUB_ENV"
        fi
