name: Setup Linux dependencies
description: Install the system packages required to build ReScript.

runs:
  using: composite
  steps:
    # Installed with apt, so that dpkg knows them: opam checks system
    # packages with dpkg, and an earlier cache that unpacked these files
    # without dpkg made opam take them for missing. musl-tools is needed for
    # the static builds; bubblewrap and rsync for opam builds in a restored
    # environment, such as coverage's bisect_ppx pin; cmake for OPAM.
    # ocaml/setup-ocaml installs its own packages, such as the multilib ones,
    # when it builds an environment.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes -qq \
          --no-install-recommends --no-upgrade \
          bubblewrap musl-tools rsync cmake
