name: Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OCAMLRUNPARAM: b

jobs:
  coverage:
    runs-on: ubuntu-26.04-arm
    permissions:
      actions: write # For build cache overwriting
      id-token: write # For CodeCov OIDC
    env:
      OS: ubuntu-26.04-arm
      OCAML_COMPILER: 5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Setup Linux dependencies
        uses: ./.github/actions/setup-linux-dependencies

      - name: Setup OCaml ${{ env.OCAML_COMPILER }}
        id: setup_ocaml
        uses: ./.github/actions/setup-ocaml
        with:
          compiler: ${{ env.OCAML_COMPILER }}
          os: ${{ env.OS }}
          cache-prefix: opam-coverage-v2
          dependency-flags: --deps-only --with-test --with-dev-setup

      - name: Install OCaml coverage tooling
        run: >-
          opam pin add bisect_ppx
          git+https://github.com/patricoferris/bisect_ppx.git#7061d643ff492b0045796357ee6917ded21fb1f0
          --yes

      # --- Coverage build cache --------------------------------------------
      # The bisect_ppx-instrumented dune build is a separate artifact from
      # the main CI build, so it gets its own key. Only save on master
      # pushes — PRs share the master cache to stay fast but won't poison
      # it. The key changes only with the dependencies: a key that changed
      # with the compiler's sources would never match a pull request's.
      - name: Coverage build state key
        id: coverage-build-state-key
        run: |
          prefix="coverage-build-state-v1-${{ env.OS }}-${{ steps.setup_ocaml.outputs.setup_version }}-${{ env.OCAML_COMPILER }}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "value=${prefix}${{ hashFiles('*.opam') }}" >> "$GITHUB_OUTPUT"

      - name: Restore coverage build state
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        id: coverage-build-state
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/dune
            _build
          key: ${{ steps.coverage-build-state-key.outputs.value }}
          restore-keys: ${{ steps.coverage-build-state-key.outputs.prefix }}

      - name: Run coverage
        run: opam exec -- make coverage

      # A cache can't be overwritten, so the state is deleted and saved again,
      # together with the states of earlier dependencies.
      - name: Delete stale coverage build state
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/delete-caches
        with:
          prefix: ${{ steps.coverage-build-state-key.outputs.prefix }}

      - name: Save coverage build state
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/dune
            _build
          key: ${{ steps.coverage-build-state-key.outputs.value }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: _coverage/coverage.json
          fail_ci_if_error: false
          use_oidc: true
