name: Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OCAMLRUNPARAM: b

jobs:
  coverage:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      actions: write # For deleting earlier OPAM environments
      id-token: write # For CodeCov OIDC
    env:
      OS: ubuntu-26.04-arm
      OCAML_COMPILER: 5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Setup Linux dependencies
        uses: ./.github/actions/setup-linux-dependencies

      - name: Setup OCaml ${{ env.OCAML_COMPILER }}
        id: setup_ocaml
        uses: ./.github/actions/setup-ocaml
        with:
          compiler: ${{ env.OCAML_COMPILER }}
          os: ${{ env.OS }}
          cache-prefix: opam-coverage-v2
          dependency-flags: --deps-only --with-test --with-dev-setup

      - name: Install OCaml coverage tooling
        run: >-
          opam pin add bisect_ppx
          git+https://github.com/patricoferris/bisect_ppx.git#7061d643ff492b0045796357ee6917ded21fb1f0
          --yes

      # No build state is cached: every compiler change misses it, and the
      # instrumented build takes about 30 s.
      - name: Run coverage
        run: opam exec -- make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: _coverage/coverage.json
          fail_ci_if_error: false
          use_oidc: true
