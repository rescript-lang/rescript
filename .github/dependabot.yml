version: 2
updates:
  # Manage npm dependencies in the top-level package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Manage GitHub Actions dependencies in the workflows and in the composite
  # actions under .github/actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
